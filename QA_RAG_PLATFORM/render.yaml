## Render.com — Production Blueprint (v7.0.0)
##
## How to deploy:
##   Render Dashboard → New → Blueprint → select repo → path: QA_RAG_PLATFORM/render.yaml
##
## Set all  sync: false  vars in the Render dashboard Environment tab.
## Never commit .env or secrets to this file.

services:

  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: qa-rag-platform-api
    runtime: python
    rootDir: QA_RAG_PLATFORM
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── LLM providers ─────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # ── Vector DB ──────────────────────────────────────────────────────────
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: qa-rag-platform
      - key: PINECONE_NAMESPACE
        value: prod
      # ── Knowledge Graph ────────────────────────────────────────────────────
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # ── Redis + Celery ─────────────────────────────────────────────────────
      - key: REDIS_URL
        fromService:
          name: qa-rag-platform-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: qa-rag-platform-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: qa-rag-platform-redis
          type: redis
          property: connectionString
      # ── Database ───────────────────────────────────────────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: qa-rag-platform-db
          property: connectionString
      # ── Auth ───────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false       # set to https://your-frontend.onrender.com
      # ── Connectors ─────────────────────────────────────────────────────────
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_TOKEN
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      # ── SAML SSO ───────────────────────────────────────────────────────────
      - key: SAML_SP_ENTITY_ID
        sync: false
      - key: SAML_SP_CALLBACK_URL
        sync: false
      - key: SAML_IDP_ENTITY_ID
        sync: false
      - key: SAML_IDP_SSO_URL
        sync: false
      - key: SAML_IDP_SLO_URL
        sync: false
      - key: SAML_IDP_CERT
        sync: false
      - key: SAML_SP_CERT
        sync: false
      - key: SAML_SP_KEY
        sync: false
      - key: SAML_STRICT
        value: "true"
      # ── Vault (HCP Vault Secrets or self-hosted) ───────────────────────────
      - key: VAULT_ADDR
        sync: false
      - key: VAULT_TOKEN
        sync: false
      - key: VAULT_MOUNT
        value: secret
      - key: VAULT_PATH_PREFIX
        value: qa-rag-platform
      # ── Observability ──────────────────────────────────────────────────────
      - key: OTEL_SERVICE_NAME
        value: qa-rag-platform-api
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false       # optional: Grafana Cloud / Honeycomb / Datadog OTLP endpoint

  # ── Celery Worker ─────────────────────────────────────────────────────────
  - type: worker
    name: qa-rag-platform-celery
    runtime: python
    rootDir: QA_RAG_PLATFORM
    buildCommand: pip install -r backend/requirements.txt
    startCommand: >
      celery -A backend.celery_app:celery_app worker
      --loglevel=info
      --concurrency=2
      --queues=default,ingestion,agents
    plan: starter
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: qa-rag-platform
      - key: PINECONE_NAMESPACE
        value: prod
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: REDIS_URL
        fromService:
          name: qa-rag-platform-redis
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: qa-rag-platform-redis
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: qa-rag-platform-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: qa-rag-platform-db
          property: connectionString
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_TOKEN
        sync: false
      - key: JIRA_BASE_URL
        sync: false

  # ── Frontend ──────────────────────────────────────────────────────────────
  - type: web
    name: qa-rag-platform-frontend
    runtime: node
    rootDir: QA_RAG_PLATFORM/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: starter
    autoDeploy: true
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false       # set to https://qa-rag-platform-api.onrender.com
      - key: NEXT_PUBLIC_ENV
        value: production

  # ── Redis ─────────────────────────────────────────────────────────────────
  - type: redis
    name: qa-rag-platform-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  # ── PostgreSQL ────────────────────────────────────────────────────────────
  - name: qa-rag-platform-db
    plan: free
    databaseName: qa_rag_platform
    user: qa_rag_user
