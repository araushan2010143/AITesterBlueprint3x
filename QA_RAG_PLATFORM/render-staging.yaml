## Render.com — Staging Blueprint (FREE tier only)
##
## Deploy: Render Dashboard → New → Blueprint
##         Repo: AITesterBlueprint3x
##         File: QA_RAG_PLATFORM/render-staging.yaml
##
## All services on free plan — no payment required.
## Celery runs as a background thread inside the API process (no separate worker needed).

services:

  # ── Backend API ────────────────────────────────────────────────────────────
  - type: web
    name: qa-rag-platform-api-staging
    runtime: python
    rootDir: QA_RAG_PLATFORM
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: ENVIRONMENT
        value: staging
      # ── LLM ───────────────────────────────────────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      # ── Vector DB ─────────────────────────────────────────────────────────
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: qa-rag-platform
      - key: PINECONE_NAMESPACE
        value: staging
      # ── Database (SQLite — no payment needed) ─────────────────────────────
      - key: DATABASE_URL
        value: sqlite:///./qa_rag_staging.db
      # ── Redis (from managed Redis below) ──────────────────────────────────
      - key: REDIS_URL
        fromService:
          name: qa-rag-platform-redis-staging
          type: redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          name: qa-rag-platform-redis-staging
          type: redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          name: qa-rag-platform-redis-staging
          type: redis
          property: connectionString
      # ── Knowledge Graph ────────────────────────────────────────────────────
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      # ── Auth ──────────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      # ── Connectors ────────────────────────────────────────────────────────
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_TOKEN
        sync: false
      - key: JIRA_BASE_URL
        sync: false
      # ── SAML (set after first deploy once you have the staging URL) ────────
      - key: SAML_SP_ENTITY_ID
        sync: false
      - key: SAML_SP_CALLBACK_URL
        sync: false
      - key: SAML_IDP_ENTITY_ID
        sync: false
      - key: SAML_IDP_SSO_URL
        sync: false
      - key: SAML_IDP_CERT
        sync: false
      - key: SAML_SP_CERT
        sync: false
      - key: SAML_SP_KEY
        sync: false
      - key: SAML_STRICT
        value: "true"
      # ── Observability ──────────────────────────────────────────────────────
      - key: OTEL_SERVICE_NAME
        value: qa-rag-platform-api-staging

  # ── Frontend ───────────────────────────────────────────────────────────────
  - type: web
    name: qa-rag-platform-frontend-staging
    runtime: node
    rootDir: QA_RAG_PLATFORM/frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    plan: free
    autoDeploy: false
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false      # set to https://qa-rag-platform-api-staging.onrender.com
      - key: NEXT_PUBLIC_ENV
        value: staging

  # ── Redis ──────────────────────────────────────────────────────────────────
  - type: redis
    name: qa-rag-platform-redis-staging
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
