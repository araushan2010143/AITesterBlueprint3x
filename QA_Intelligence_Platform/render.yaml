services:
  - type: web
    name: qa-intelligence-api
    env: docker
    rootDir: QA_Intelligence_Platform   # monorepo: Docker context = QA_Intelligence_Platform/
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free               # HF Inference API handles embeddings — no local ML models
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # ── Embeddings (HF Inference API — zero RAM, free) ─────────────────────
      # Get a read token at huggingface.co/settings/tokens
      - key: HF_API_KEY
        sync: false

      # ── LLM (at least GROQ_API_KEY required) ───────────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Qdrant Cloud (sign up free at cloud.qdrant.io) ─────────────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_LOCAL_PATH
        value: ""

      # ── App config ──────────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: FILE_REGISTRY_DB
        value: /tmp/file_registry.db
      - key: DATABASE_URL
        value: sqlite:////tmp/qa_platform.db
      - key: RATE_LIMIT_DISABLED
        value: "false"
