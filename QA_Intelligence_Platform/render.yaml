services:
  - type: web
    name: qa-intelligence-api
    env: python
    plan: standard          # needs 2 GB RAM for bge-m3 + reranker models
    region: oregon
    buildCommand: pip install -e ".[dev]"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false         # set in Render dashboard
      - key: QDRANT_URL
        sync: false         # set to Qdrant Cloud URL
      - key: QDRANT_API_KEY
        sync: false         # set in Render dashboard
      - key: OPENAI_API_KEY
        sync: false         # optional fallback LLM
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: FILE_REGISTRY_DB
        value: /tmp/file_registry.db
      - key: RATE_LIMIT_DISABLED
        value: "false"
