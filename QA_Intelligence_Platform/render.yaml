services:
  - type: web
    name: qa-intelligence-api
    runtime: python
    rootDir: QA_Intelligence_Platform/backend
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"

      # ── Embeddings (HF Inference API — zero RAM, free) ──────────────────
      - key: HF_API_KEY
        sync: false

      # ── LLM (GROQ_API_KEY required at minimum) ──────────────────────────
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false

      # ── Qdrant Cloud ─────────────────────────────────────────────────────
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_LOCAL_PATH
        value: ""

      # ── App config ───────────────────────────────────────────────────────
      - key: JWT_SECRET
        generateValue: true
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: FILE_REGISTRY_DB
        value: /tmp/file_registry.db
      - key: DATABASE_URL
        value: sqlite:////tmp/qa_platform.db
      - key: RATE_LIMIT_DISABLED
        value: "false"
