[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "qa-intelligence-platform"
version = "1.0.0"
description = "Enterprise QA Intelligence Platform — Knowledge Layer + Hybrid Retrieval + Multi-Agent AI"
requires-python = ">=3.11"
dependencies = [
    # ── Web Framework ─────────────────────────────────────────────────────────
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",

    # ── Database ──────────────────────────────────────────────────────────────
    "sqlmodel==0.0.22",
    "alembic==1.14.0",

    # ── Vector DB ─────────────────────────────────────────────────────────────
    "qdrant-client==1.11.3",

    # ── Embeddings + Reranker (local BAAI/bge-m3) ─────────────────────────────
    "FlagEmbedding==1.2.11",          # BAAI/bge-m3 + bge-reranker-large
    "torch>=2.2.0",
    "transformers>=4.41.0",

    # ── BM25 (sparse retrieval) ───────────────────────────────────────────────
    "rank-bm25==0.2.2",

    # ── Document Parsers ──────────────────────────────────────────────────────
    "pypdf==4.3.1",
    "python-docx==1.1.2",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "tree-sitter==0.22.3",
    "tree-sitter-languages==1.10.2",   # Pin for Python 3.11 wheel

    # ── LLM / Agent ───────────────────────────────────────────────────────────
    "anthropic==0.34.2",
    "openai==1.54.4",
    "groq==0.11.0",
    "mistralai==1.1.0",
    "cohere==5.11.0",
    "google-generativeai==0.8.3",
    "langgraph==0.2.34",
    "langchain-core==0.3.13",

    # ── Scheduler ─────────────────────────────────────────────────────────────
    "apscheduler==3.10.4",

    # ── Auth ──────────────────────────────────────────────────────────────────
    "python-jose[cryptography]==3.3.0",
    "bcrypt==4.2.0",
    "passlib==1.7.4",

    # ── Graph DB ──────────────────────────────────────────────────────────────
    "neo4j==5.24.0",

    # ── Caching / Queue ───────────────────────────────────────────────────────
    "redis==5.2.0",
    "celery==5.4.0",

    # ── Observability ─────────────────────────────────────────────────────────
    "opentelemetry-api==1.27.0",
    "opentelemetry-sdk==1.27.0",

    # ── Utils ─────────────────────────────────────────────────────────────────
    "python-dotenv==1.0.1",
    "pydantic-settings==2.6.1",
    "httpx==0.27.2",
    "tenacity==9.0.0",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "httpx==0.27.2",
    "ruff==0.7.1",
    "mypy==1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
