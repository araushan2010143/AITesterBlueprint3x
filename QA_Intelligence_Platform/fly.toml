# Fly.io deployment config for QA Intelligence Platform backend
# Deploy: fly deploy --config QA_Intelligence_Platform/fly.toml

app = "qa-intelligence-api"
primary_region = "sin"   # Singapore — closest to India

[build]
  dockerfile = "backend/Dockerfile.huggingface"
  build_target = ""

[build.args]
  # pin to same version as Dockerfile
  PYTHON_VERSION = "3.11.9"

[[services]]
  internal_port = 8000
  protocol      = "tcp"
  auto_stop_machines  = false   # keep alive — no cold starts
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port     = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port     = 443

  [services.concurrency]
    type       = "requests"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval      = 30000
    timeout       = 10000
    grace_period  = "30s"
    method        = "GET"
    path          = "/health"

[env]
  UPLOAD_DIR       = "/tmp/uploads"
  DATABASE_URL     = "sqlite:////tmp/qa_platform.db"
  FILE_REGISTRY_DB = "/tmp/file_registry.db"
  PORT             = "8000"

# Secrets — set these with: fly secrets set KEY=VALUE
# fly secrets set GROQ_API_KEY=your-key HF_API_KEY=your-key ...
# (never put real values here)
