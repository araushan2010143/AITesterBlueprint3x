name: CI - Playwright API BDD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        working-directory: ./playwright-api-bdd-framework

      - name: TypeScript compile check
        run: npx tsc --noEmit
        working-directory: ./playwright-api-bdd-framework

      - name: Cucumber dry-run
        run: npx cucumber-js --require-module ts-node/register --require tests/steps/**/*.ts tests/features --dry-run
        working-directory: ./playwright-api-bdd-framework
      - name: Run tests (QA environment)
        env:
          NODE_ENV: qa
        run: |
          npm run test:qa
          npm run report
          npm run allure:generate
        working-directory: ./playwright-api-bdd-framework
        # Note: This step runs cucumber features against QA endpoints. If your tests make
        # real API calls, consider using a dedicated test environment or mocking.

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        with:
          name: api-test-reports
          path: |
            playwright-api-bdd-framework/reports
            playwright-api-bdd-framework/allure-results
            playwright-api-bdd-framework/reports/allure-report
