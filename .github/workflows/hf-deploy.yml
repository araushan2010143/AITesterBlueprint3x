name: Deploy Backend → Hugging Face Spaces

on:
  push:
    branches: [main]
    paths:
      - 'QA_Intelligence_Platform/backend/**'
  workflow_dispatch:   # allow manual trigger from GitHub Actions tab

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Push to HF Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: qa-intelligence-api
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_USERNAME" ]; then
            echo "HF_TOKEN or HF_USERNAME not configured — skipping Hugging Face deploy."
            echo "Add them under Settings → Secrets and variables → Actions to enable."
            exit 0
          fi

          git config --global user.email "ci@github.com"
          git config --global user.name "GitHub Actions"

          mkdir /tmp/hf-space
          cp -r QA_Intelligence_Platform/backend/. /tmp/hf-space/

          # Rename Dockerfile.huggingface → Dockerfile (HF Space uses this)
          cp /tmp/hf-space/Dockerfile.huggingface /tmp/hf-space/Dockerfile
          rm /tmp/hf-space/Dockerfile.huggingface

          # Generate required HF Space README with space metadata
          cat > /tmp/hf-space/README.md << 'HFREADME'
          ---
          title: QA Intelligence API
          emoji: 🤖
          colorFrom: blue
          colorTo: purple
          sdk: docker
          pinned: false
          app_port: 8000
          ---

          # QA Intelligence Platform — Backend API

          FastAPI backend for the QA Intelligence Platform.
          Provides chat, semantic search, RAG, agents, and ingest endpoints.

          **Frontend:** [qabuddy-app.vercel.app](https://qabuddy-app.vercel.app)
          **Docs:** `/api/docs`
          HFREADME

          cd /tmp/hf-space
          git init
          git add .
          git commit -m "Deploy $(date -u '+%Y-%m-%d %H:%M UTC')"

          git remote add hf \
            https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME

          git push hf HEAD:main --force
