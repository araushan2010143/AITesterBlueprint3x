name: Keep Render Backends Alive

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes — Render sleeps after 15 min inactivity
  workflow_dispatch:         # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping QA Intelligence Platform API (Render — account 2)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 50 \
            https://qa-intelligence-api-1tcq.onrender.com/health || echo "000")
          echo "QA Intelligence Platform: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: QA Intelligence API returned $STATUS (may be waking up)"
          fi

      # QA RAG Platform keep-alive is in araushan2010143/qa-rag-platform repo
