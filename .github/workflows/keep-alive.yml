name: Keep Render Backends Alive

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes — Render sleeps after 15 min inactivity
  workflow_dispatch:         # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping QA Intelligence Platform API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 50 \
            https://qa-intelligence-api.onrender.com/health || echo "000")
          echo "QA Intelligence Platform: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: QA Intelligence API returned $STATUS (may be waking up)"
          fi

      - name: Ping QA RAG Platform API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 50 \
            https://qa-rag-platform-api-staging.onrender.com/health || echo "000")
          echo "QA RAG Platform: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: QA RAG Platform returned $STATUS (may be waking up)"
          fi
