name: Keep Render Backends Alive

on:
  schedule:
    - cron: "*/10 * * * *"  # every 10 minutes — Render sleeps after 15 min inactivity
  workflow_dispatch:         # allow manual trigger from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping QA Intelligence Platform API (HF Space)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 50 \
            https://araushan2010143-qa-intelligence-api.hf.space/health || echo "000")
          echo "QA Intelligence Platform: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warning: QA Intelligence API returned $STATUS (may be waking up)"
          fi

      # QA RAG Platform keep-alive moved to araushan2010143/qa-rag-platform repo
