name: Cypress API Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: ./cypress-api-bdd-framework

      - name: Install Cypress binary
        run: npx cypress install
        working-directory: ./cypress-api-bdd-framework

      - name: Run Cypress feature tests (Allure enabled)
        run: |
          CYPRESS_ENV=qa npx cypress run --config-file cypress.config.ts --spec "cypress/e2e/features/**/*.feature" --env allure=true,allureReuseAfterSpec=true
        working-directory: ./cypress-api-bdd-framework

      - name: Generate Allure HTML report
        run: |
          npx allure generate allure-results --clean -o reports/allure-report || true
        working-directory: ./cypress-api-bdd-framework

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: ./cypress-api-bdd-framework/allure-results

      - name: Upload Allure HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: ./cypress-api-bdd-framework/reports/allure-report
